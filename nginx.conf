server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.html;

    # Configuration cruciale pour React et les modules JS
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Force le type JS pour les extensions courantes de React
    types {
        application/javascript js mjs jsx;
        text/css css;
        image/svg+xml svg;
    }

    location / {
        # Permet au React Router de fonctionner (redirige tout vers index.html)
        try_files $uri $uri/ /index.html;
        
        # Désactiver le cache pour le dev (optionnel)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}   
